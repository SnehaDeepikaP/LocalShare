{% extends "base.html" %}
{% block title %}404 Not Found — LocalShare{% endblock %}

{% block content %}
<section class="py-5 text-center">
  <div class="container max-w-600 mx-auto py-5">
    <div class="card border-0 shadow-sm p-5 bg-white">
      <div class="text-primary mb-3"><i class="bi bi-compass fs-1" style="font-size: 4rem;"></i></div>
      <h2 class="fw-bold mb-2">404 — Page Not Found</h2>
      <p class="text-muted mb-4">
        The community post, profile, or page you are looking for does not exist or may have been removed.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4">
          <i class="bi bi-house me-1"></i>Home
        </a>
        <a href="{{ url_for('posts.posts') }}" class="btn btn-outline-secondary px-4">
          <i class="bi bi-grid me-1"></i>Browse Posts
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
