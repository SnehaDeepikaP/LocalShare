{% extends "base.html" %}
{% block title %}400 Bad Request — LocalShare{% endblock %}

{% block content %}
<section class="py-5 text-center">
  <div class="container max-w-600 mx-auto py-5">
    <div class="card border-0 shadow-sm p-5 bg-white">
      <div class="text-warning mb-3"><i class="bi bi-exclamation-octagon fs-1" style="font-size: 4rem;"></i></div>
      <h2 class="fw-bold mb-2">400 — Bad Request</h2>
      <p class="text-muted mb-4">
        Your browser sent a request that could not be processed. This often happens if a security token expired or form data was malformed.
      </p>
      <div>
        <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4">
          <i class="bi bi-house me-1"></i>Return to Home
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
