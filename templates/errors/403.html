{% extends "base.html" %}
{% block title %}403 Forbidden — LocalShare{% endblock %}

{% block content %}
<section class="py-5 text-center">
  <div class="container max-w-600 mx-auto py-5">
    <div class="card border-0 shadow-sm p-5 bg-white">
      <div class="text-danger mb-3"><i class="bi bi-shield-lock fs-1" style="font-size: 4rem;"></i></div>
      <h2 class="fw-bold mb-2">403 — Access Forbidden</h2>
      <p class="text-muted mb-4">
        You do not have permission to view or modify this resource. If you believe this is an error, please check your login permissions.
      </p>
      <div>
        <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4">
          <i class="bi bi-house me-1"></i>Return to Home
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
